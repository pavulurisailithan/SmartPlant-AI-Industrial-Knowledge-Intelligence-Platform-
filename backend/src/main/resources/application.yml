spring:
  application:
    name: smartplant-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartplant}
    username: ${SPRING_DATASOURCE_USERNAME:smartplant}
    password: ${SPRING_DATASOURCE_PASSWORD:smartplant123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://smartplant:smartplant123@localhost:27017/smartplant?authSource=admin}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:smartplant-jwt-secret-key-2024-industrial-ai-platform}
  expiration: 86400000

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
