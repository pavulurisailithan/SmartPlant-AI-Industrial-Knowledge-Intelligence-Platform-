version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: smartplant
      POSTGRES_USER: smartplant
      POSTGRES_PASSWORD: smartplant123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartplant"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: smartplant
      MONGO_INITDB_ROOT_PASSWORD: smartplant123
      MONGO_INITDB_DATABASE: smartplant
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/smartplant123
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartplant
      SPRING_DATASOURCE_USERNAME: smartplant
      SPRING_DATASOURCE_PASSWORD: smartplant123
      SPRING_DATA_MONGODB_URI: mongodb://smartplant:smartplant123@mongodb:27017/smartplant?authSource=admin
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: smartplant123
      JWT_SECRET: smartplant-jwt-secret-key-2024-industrial-ai
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      neo4j:
        condition: service_started

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo-key}
      POSTGRES_URL: postgresql://smartplant:smartplant123@postgres:5432/smartplant
      MONGO_URL: mongodb://smartplant:smartplant123@mongodb:27017/smartplant?authSource=admin
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: smartplant123
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - postgres
      - mongodb
      - neo4j

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:8080
      REACT_APP_AI_URL: http://localhost:8000
    depends_on:
      - backend
      - ai-service

volumes:
  postgres_data:
  mongo_data:
  neo4j_data:
  uploads_data:
